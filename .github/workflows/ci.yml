name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Verify Chrome
        run: google-chrome --version

      - name: Run tests
        id: run_tests
        env:
          MAVEN_OPTS: "-Xmx1g"
        run: mvn -B clean test -DtrimStackTrace=false -Dsurefire.printSummary=true -Dheadless=true

      - name: Build notification details
        if: always()
        id: notify_details
        run: |
          JAVA_VERSION=$(java -version 2>&1 | head -n 1 | awk -F\" '{print $2}')
          COMMIT_SHA=${GITHUB_SHA:0:7}

          TOTAL=0
          FAILED=0
          SKIPPED=0
          PASSED=0

          if ls target/surefire-reports/*.txt >/dev/null 2>&1; then
            while read -r line; do
              RUN=$(echo "$line" | sed -n 's/.*Tests run: \([0-9]*\).*/\1/p')
              FAIL=$(echo "$line" | sed -n 's/.*Failures: \([0-9]*\).*/\1/p')
              ERR=$(echo "$line" | sed -n 's/.*Errors: \([0-9]*\).*/\1/p')
              SKIP=$(echo "$line" | sed -n 's/.*Skipped: \([0-9]*\).*/\1/p')

              if [ -n "$RUN" ]; then
                TOTAL=$((TOTAL + RUN))
                FAILED=$((FAILED + FAIL + ERR))
                SKIPPED=$((SKIPPED + SKIP))
              fi
            done < <(grep -h "Tests run:" target/surefire-reports/*.txt || true)
          fi

          PASSED=$((TOTAL - FAILED - SKIPPED))

          if [ "${{ job.status }}" = "success" ]; then
            RESULT_MSG="All tests passed."
          else
            FAILING_TESTS=$(grep -R "<failure" -n target/surefire-reports/TEST-*.xml | head -n 10 || true)
            if [ -z "$FAILING_TESTS" ]; then
              RESULT_MSG="Tests failed. See surefire reports for details."
            else
              RESULT_MSG="Failing tests:\n$FAILING_TESTS"
            fi
          fi

          echo "java_version=$JAVA_VERSION" >> $GITHUB_OUTPUT
          echo "commit_sha=$COMMIT_SHA" >> $GITHUB_OUTPUT
          echo "total=$TOTAL" >> $GITHUB_OUTPUT
          echo "passed=$PASSED" >> $GITHUB_OUTPUT
          echo "failed=$FAILED" >> $GITHUB_OUTPUT
          echo "skipped=$SKIPPED" >> $GITHUB_OUTPUT

          echo "result<<EOF" >> $GITHUB_OUTPUT
          echo "$RESULT_MSG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Upload Surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports

      - name: Slack notify
        if: always()
        uses: slackapi/slack-github-action@v1.27.0
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        with:
          payload: |
            {
              "text": "${{ job.status == 'success' && '✅ CI Passed' || '❌ CI Failed' }} - ${{ github.repository }}",
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": "${{ job.status == 'success' && '✅ CI Passed' || '❌ CI Failed' }}"
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    { "type": "mrkdwn", "text": "*Repo:*\n${{ github.repository }}" },
                    { "type": "mrkdwn", "text": "*Branch:*\n${{ github.ref_name }}" },
                    { "type": "mrkdwn", "text": "*Java:*\n${{ steps.notify_details.outputs.java_version }}" },
                    { "type": "mrkdwn", "text": "*Commit:*\n${{ steps.notify_details.outputs.commit_sha }}" }
                  ]
                },
                {
                  "type": "section",
                  "fields": [
                    { "type": "mrkdwn", "text": "*Status:*\n${{ job.status }}" },
                    { "type": "mrkdwn", "text": "*Passed:*\n${{ steps.notify_details.outputs.passed }}" },
                    { "type": "mrkdwn", "text": "*Failed:*\n${{ steps.notify_details.outputs.failed }}" },
                    { "type": "mrkdwn", "text": "*Skipped:*\n${{ steps.notify_details.outputs.skipped }}" },
                    { "type": "mrkdwn", "text": "*Total:*\n${{ steps.notify_details.outputs.total }}" }
                  ]
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Result*\n${{ steps.notify_details.outputs.result }}"
                  }
                },
                {
                  "type": "actions",
                  "elements": [
                    {
                      "type": "button",
                      "text": { "type": "plain_text", "text": "View Run" },
                      "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                    }
                  ]
                }
              ]
            }

      - name: Email notify
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "CI ${{ job.status }}: ${{ github.repository }}"
          to: ${{ secrets.NOTIFY_EMAIL_TO }}
          from: ${{ secrets.NOTIFY_EMAIL_FROM }}
          body: |
            CI Notification

            Repo:   ${{ github.repository }}
            Branch: ${{ github.ref_name }}
            Action: ${{ github.event_name }}
            Java:   ${{ steps.notify_details.outputs.java_version }}
            Commit: ${{ steps.notify_details.outputs.commit_sha }}

            Status:  ${{ job.status }}
            Passed:  ${{ steps.notify_details.outputs.passed }}
            Failed:  ${{ steps.notify_details.outputs.failed }}
            Skipped: ${{ steps.notify_details.outputs.skipped }}
            Total:   ${{ steps.notify_details.outputs.total }}

            Result:
            ${{ steps.notify_details.outputs.result }}

            Run:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}